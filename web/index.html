<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公众号股票汇总</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d9dee7;
      --blue: #2563eb;
      --green: #0f8f66;
      --amber: #b7791f;
      --red: #c2410c;
      --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }
    header {
      background: #17202a;
      color: #fff;
      padding: 18px 28px;
      border-bottom: 4px solid var(--green);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      max-width: 1480px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      color: #d6dde8;
      font-size: 13px;
      white-space: nowrap;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
    }
    .hidden { display: none !important; }
    .link-button {
      height: auto;
      padding: 0;
      background: transparent;
      color: #d6dde8;
      font-size: 13px;
      border-radius: 0;
    }
    .login-view {
      max-width: 420px;
      margin: 72px auto;
      padding: 0 16px;
    }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .login-card h2 {
      margin-bottom: 16px;
      font-size: 20px;
    }
    .login-card form {
      display: grid;
      gap: 12px;
    }
    .error-text {
      min-height: 20px;
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
    }
    .admin-panel {
      margin-bottom: 18px;
    }
    .admin-form {
      display: grid;
      grid-template-columns: minmax(160px, 220px) minmax(160px, 220px) auto 1fr;
      gap: 12px;
      align-items: end;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }
    .user-list {
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px 28px 32px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, minmax(160px, 240px)) 1fr;
      gap: 12px;
      align-items: end;
      margin-bottom: 18px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    select, input {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 0 10px;
      font-size: 14px;
      min-width: 0;
    }
    button {
      height: 38px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      color: #fff;
      background: var(--blue);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.96); }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: var(--shadow);
      min-height: 88px;
    }
    .metric .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .metric .value {
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }
    .metric:nth-child(2) .value { color: var(--blue); }
    .metric:nth-child(3) .value { color: var(--green); }
    .metric:nth-child(4) .value { color: var(--amber); }
    .stock-view {
      margin-bottom: 18px;
    }
    .stock-tools {
      display: flex;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }
    .stock-tools label {
      width: min(240px, 100%);
    }
    .stock-view-summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(110px, 1fr));
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .mini-metric {
      border: 1px solid #edf0f5;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      min-height: 66px;
    }
    .mini-metric .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .mini-metric .value {
      font-size: 22px;
      font-weight: 800;
    }
    .mini-metric.good .value { color: var(--green); }
    .mini-metric.bad .value { color: var(--red); }
    .mini-metric.neutral .value { color: var(--amber); }
    .stock-view-grid {
      display: grid;
      grid-template-columns: minmax(620px, 2fr) minmax(320px, 1fr);
      gap: 0;
    }
    .stock-view-grid > div:first-child {
      border-right: 1px solid var(--line);
    }
    .sentiment {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .sentiment-badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 800;
    }
    .sentiment-badge.good {
      background: #e8f7f1;
      color: #047857;
    }
    .sentiment-badge.bad {
      background: #fff0ed;
      color: #c2410c;
    }
    .sentiment-badge.neutral {
      background: #fff4df;
      color: #975a16;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(620px, 2fr) minmax(320px, 1fr);
      gap: 16px;
      align-items: start;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    h2 {
      margin: 0;
      font-size: 16px;
    }
    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid #edf0f5;
      vertical-align: top;
      text-align: left;
      font-size: 14px;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      background: #fbfcfe;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .table-wrap {
      max-height: 560px;
      overflow: auto;
    }
    .stock-name {
      font-weight: 800;
      color: #111827;
    }
    .code {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef4ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      margin: 0 4px 4px 0;
      overflow-wrap: anywhere;
    }
    .pill.green {
      background: #e8f7f1;
      color: #047857;
    }
    .pill.amber {
      background: #fff4df;
      color: #975a16;
    }
    .evidence {
      color: #344054;
      line-height: 1.55;
      max-height: 68px;
      overflow: hidden;
    }
    .detail-list {
      display: grid;
      gap: 12px;
      padding: 14px;
      max-height: 560px;
      overflow: auto;
    }
    .mention {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }
    .mention-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-weight: 800;
    }
    .mention p {
      margin: 6px 0;
      color: #344054;
      line-height: 1.55;
      font-size: 13px;
    }
    .mention a {
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
    }
    .bars {
      padding: 14px 16px;
      display: grid;
      gap: 12px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(80px, 140px) 1fr auto;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }
    .bar-bg {
      height: 10px;
      background: #edf0f5;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: var(--w);
      background: linear-gradient(90deg, var(--green), var(--blue));
    }
    .empty {
      padding: 32px 16px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 980px) {
      .toolbar, .summary, .grid, .stock-view-summary, .stock-view-grid, .admin-form {
        grid-template-columns: 1fr;
      }
      .stock-view-grid > div:first-child {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      header, main {
        padding-left: 16px;
        padding-right: 16px;
      }
      .header-row {
        align-items: flex-start;
        flex-direction: column;
      }
      .table-wrap {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>公众号股票汇总</h1>
      <div class="status">
        <span class="status-dot"></span>
        <span id="statusText">未登录</span>
        <span id="userBadge"></span>
        <button id="logoutBtn" class="link-button hidden" type="button">退出</button>
      </div>
    </div>
  </header>

  <div id="loginView" class="login-view">
    <section class="login-card">
      <h2>账号登录</h2>
      <form id="loginForm">
        <label>账号
          <input id="loginUsername" autocomplete="username" required>
        </label>
        <label>密码
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">登录</button>
        <div id="loginError" class="error-text"></div>
      </form>
    </section>
  </div>

  <main id="appShell" class="hidden">
    <section id="adminPanel" class="admin-panel hidden">
      <div class="section-head">
        <h2>账号管理</h2>
        <span class="count" id="userCountText">0 个账号</span>
      </div>
      <form id="createUserForm" class="admin-form">
        <label>普通账号
          <input id="newUsername" autocomplete="off" placeholder="例如 trader01">
        </label>
        <label>初始密码
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="至少 6 位">
        </label>
        <button type="submit">创建账号</button>
        <div id="userMessage" class="error-text"></div>
      </form>
      <div id="userList" class="user-list"></div>
    </section>
    <div class="toolbar">
      <label>日期
        <select id="dateSelect"></select>
      </label>
      <label>渠道
        <select id="channelSelect">
          <option value="">全部渠道</option>
        </select>
      </label>
      <label>关键词
        <input id="keywordInput" type="search" placeholder="股票/题材/证据">
      </label>
      <button id="refreshBtn" type="button">刷新</button>
    </div>

    <div class="summary">
      <div class="metric"><div class="label">文章数</div><div class="value" id="articleCount">0</div></div>
      <div class="metric"><div class="label">提及次数</div><div class="value" id="mentionCount">0</div></div>
      <div class="metric"><div class="label">股票数</div><div class="value" id="stockCount">0</div></div>
      <div class="metric"><div class="label">题材数</div><div class="value" id="themeCount">0</div></div>
    </div>

    <section class="stock-view">
      <div class="section-head">
        <h2>股票视角</h2>
        <span class="count" id="stockViewRange">最近 7 天</span>
      </div>
      <div class="stock-tools">
        <label>统计窗口
          <select id="stockWindowSelect">
            <option value="7">过去 7 天</option>
            <option value="14">过去 14 天</option>
            <option value="30">过去 30 天</option>
          </select>
        </label>
        <label>股票筛选
          <input id="stockKeywordInput" type="search" placeholder="输入股票名或代码">
        </label>
      </div>
      <div class="stock-view-summary">
        <div class="mini-metric"><div class="label">股票数</div><div class="value" id="windowStockCount">0</div></div>
        <div class="mini-metric"><div class="label">提及次数</div><div class="value" id="windowMentionCount">0</div></div>
        <div class="mini-metric"><div class="label">出现天数</div><div class="value" id="windowActiveDays">0</div></div>
        <div class="mini-metric good"><div class="label">利好</div><div class="value" id="windowBullishCount">0</div></div>
        <div class="mini-metric bad"><div class="label">利空</div><div class="value" id="windowBearishCount">0</div></div>
        <div class="mini-metric neutral"><div class="label">普通提及</div><div class="value" id="windowNeutralCount">0</div></div>
      </div>
      <div class="stock-view-grid">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 21%;">股票</th>
                <th style="width: 21%;">利好/利空</th>
                <th style="width: 12%;">天数</th>
                <th style="width: 14%;">最近日期</th>
                <th style="width: 18%;">渠道</th>
                <th>最近证据</th>
              </tr>
            </thead>
            <tbody id="stockTrendBody"></tbody>
          </table>
        </div>
        <div class="detail-list" id="stockTrendMentions"></div>
      </div>
    </section>

    <div class="grid">
      <section>
        <div class="section-head">
          <h2>股票统计</h2>
          <span class="count" id="stockTableCount">0 条</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 19%;">股票</th>
                <th style="width: 12%;">市场</th>
                <th style="width: 22%;">题材</th>
                <th style="width: 12%;">次数</th>
                <th style="width: 12%;">置信度</th>
                <th>证据</th>
              </tr>
            </thead>
            <tbody id="stocksBody"></tbody>
          </table>
        </div>
      </section>

      <div>
        <section>
          <div class="section-head">
            <h2>题材分布</h2>
            <span class="count" id="themeCountText">0 类</span>
          </div>
          <div class="bars" id="themeBars"></div>
        </section>
        <section style="margin-top: 16px;">
          <div class="section-head">
            <h2>证据明细</h2>
            <span class="count" id="mentionCountText">0 条</span>
          </div>
          <div class="detail-list" id="mentionsList"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    const state = { data: null, user: null };
    const dateSelect = document.querySelector("#dateSelect");
    const channelSelect = document.querySelector("#channelSelect");
    const keywordInput = document.querySelector("#keywordInput");
    const stockWindowSelect = document.querySelector("#stockWindowSelect");
    const stockKeywordInput = document.querySelector("#stockKeywordInput");
    const statusText = document.querySelector("#statusText");
    const appShell = document.querySelector("#appShell");
    const loginView = document.querySelector("#loginView");
    const loginForm = document.querySelector("#loginForm");
    const logoutBtn = document.querySelector("#logoutBtn");
    const userBadge = document.querySelector("#userBadge");
    const adminPanel = document.querySelector("#adminPanel");
    const createUserForm = document.querySelector("#createUserForm");
    let stockKeywordTimer = null;

    document.querySelector("#refreshBtn").addEventListener("click", loadDashboard);
    dateSelect.addEventListener("change", loadDashboard);
    channelSelect.addEventListener("change", loadDashboard);
    keywordInput.addEventListener("input", render);
    stockWindowSelect.addEventListener("change", loadDashboard);
    stockKeywordInput.addEventListener("input", () => {
      clearTimeout(stockKeywordTimer);
      stockKeywordTimer = setTimeout(loadDashboard, 250);
    });
    loginForm.addEventListener("submit", handleLogin);
    logoutBtn.addEventListener("click", handleLogout);
    createUserForm.addEventListener("submit", handleCreateUser);

    async function bootstrap() {
      try {
        const res = await fetch("/api/me");
        if (!res.ok) {
          showLogin();
          return;
        }
        const payload = await res.json();
        state.user = payload.user;
        showApp();
        await loadDashboard();
        if (isAdmin()) await loadUsers();
      } catch (err) {
        showLogin();
        console.error(err);
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      setText("#loginError", "");
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.querySelector("#loginUsername").value.trim(),
          password: document.querySelector("#loginPassword").value,
        }),
      });
      if (!res.ok) {
        setText("#loginError", "账号或密码错误");
        return;
      }
      const payload = await res.json();
      state.user = payload.user;
      showApp();
      await loadDashboard();
      if (isAdmin()) await loadUsers();
    }

    async function handleLogout() {
      await fetch("/api/logout", { method: "POST" });
      state.user = null;
      state.data = null;
      showLogin();
    }

    function showLogin() {
      loginView.classList.remove("hidden");
      appShell.classList.add("hidden");
      logoutBtn.classList.add("hidden");
      userBadge.textContent = "";
      statusText.textContent = "未登录";
    }

    function showApp() {
      loginView.classList.add("hidden");
      appShell.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
      userBadge.textContent = state.user ? `${state.user.username} · ${state.user.role}` : "";
      adminPanel.classList.toggle("hidden", !isAdmin());
    }

    function isAdmin() {
      return state.user && state.user.role === "admin";
    }

    async function loadUsers() {
      if (!isAdmin()) return;
      const res = await fetch("/api/users");
      if (!res.ok) return;
      const payload = await res.json();
      renderUsers(payload.users || []);
    }

    async function handleCreateUser(event) {
      event.preventDefault();
      if (!isAdmin()) return;
      setText("#userMessage", "");
      const usernameInput = document.querySelector("#newUsername");
      const passwordInput = document.querySelector("#newPassword");
      const res = await fetch("/api/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: usernameInput.value.trim(),
          password: passwordInput.value,
        }),
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) {
        setText("#userMessage", payload.error || "创建失败");
        return;
      }
      usernameInput.value = "";
      passwordInput.value = "";
      setText("#userMessage", "已创建");
      await loadUsers();
    }

    function renderUsers(users) {
      setText("#userCountText", `${users.length} 个账号`);
      const box = document.querySelector("#userList");
      if (!users.length) {
        box.innerHTML = `<div class="empty">暂无账号</div>`;
        return;
      }
      box.innerHTML = users.map(user => `
        <span class="pill ${user.role === "admin" ? "amber" : ""}">
          ${escapeHtml(user.username)} · ${escapeHtml(user.role)} · ${user.is_active ? "启用" : "停用"}
        </span>
      `).join("");
    }

    async function loadDashboard() {
      statusText.textContent = "加载中";
      const params = new URLSearchParams();
      if (dateSelect.value) params.set("date", dateSelect.value);
      if (channelSelect.value) params.set("channel", channelSelect.value);
      if (stockWindowSelect.value) params.set("stock_window", stockWindowSelect.value);
      if (stockKeywordInput.value.trim()) params.set("stock_keyword", stockKeywordInput.value.trim());
      const res = await fetch(`/api/dashboard?${params.toString()}`);
      if (res.status === 401) {
        showLogin();
        return;
      }
      state.data = await res.json();
      syncControls(state.data);
      render();
      statusText.textContent = "已更新";
    }

    function syncControls(data) {
      const currentDate = dateSelect.value || data.selected_date;
      dateSelect.innerHTML = data.dates.map(date =>
        `<option value="${escapeHtml(date)}">${escapeHtml(date)}</option>`
      ).join("");
      dateSelect.value = currentDate || data.selected_date || "";

      const currentChannel = channelSelect.value || data.selected_channel;
      channelSelect.innerHTML = `<option value="">全部渠道</option>` + data.channels.map(channel =>
        `<option value="${escapeHtml(channel)}">${escapeHtml(channel)}</option>`
      ).join("");
      channelSelect.value = currentChannel || "";
      if (data.stock_view) {
        stockWindowSelect.value = String(data.stock_view.window_days || stockWindowSelect.value || 7);
      }
    }

    function render() {
      const data = state.data;
      if (!data) return;
      const keyword = keywordInput.value.trim().toLowerCase();
      const stocks = data.stocks.filter(item => textOf(item).toLowerCase().includes(keyword));
      const mentions = data.mentions.filter(item => textOf(item).toLowerCase().includes(keyword));
      setText("#articleCount", data.summary.article_count);
      setText("#mentionCount", data.summary.mention_count);
      setText("#stockCount", data.summary.stock_count);
      setText("#themeCount", data.summary.theme_count);
      setText("#stockTableCount", `${stocks.length} 条`);
      setText("#themeCountText", `${data.themes.length} 类`);
      setText("#mentionCountText", `${mentions.length} 条`);
      renderStockView(data.stock_view);
      renderStocks(stocks);
      renderThemes(data.themes);
      renderMentions(mentions);
    }

    function renderStockView(stockView) {
      const view = stockView || { summary: {}, stocks: [], mentions: [] };
      const summary = view.summary || {};
      setText("#stockViewRange", `${view.start_date || "-"} 至 ${view.end_date || "-"} · 过去 ${view.window_days || 7} 天`);
      setText("#windowStockCount", summary.stock_count || 0);
      setText("#windowMentionCount", summary.mention_count || 0);
      setText("#windowActiveDays", summary.active_days || 0);
      setText("#windowBullishCount", summary.bullish_count || 0);
      setText("#windowBearishCount", summary.bearish_count || 0);
      setText("#windowNeutralCount", summary.neutral_count || 0);
      renderStockTrends(view.stocks || []);
      renderStockTrendMentions(view.mentions || []);
    }

    function renderStockTrends(stocks) {
      const body = document.querySelector("#stockTrendBody");
      if (!stocks.length) {
        body.innerHTML = `<tr><td colspan="6" class="empty">暂无股票视角数据</td></tr>`;
        return;
      }
      body.innerHTML = stocks.map(item => `
        <tr>
          <td>
            <div class="stock-name">${escapeHtml(item.stock_name)}</div>
            <div class="code">${escapeHtml(item.stock_code || "-")}</div>
          </td>
          <td>${sentimentBadges(item)}</td>
          <td>${item.active_days || 0}</td>
          <td>${escapeHtml(item.latest_date || "-")}</td>
          <td>${pills(item.channels, "")}</td>
          <td><div class="evidence">${escapeHtml(item.evidence || "")}</div></td>
        </tr>
      `).join("");
    }

    function renderStockTrendMentions(mentions) {
      const box = document.querySelector("#stockTrendMentions");
      if (!mentions.length) {
        box.innerHTML = `<div class="empty">暂无窗口内证据</div>`;
        return;
      }
      box.innerHTML = mentions.slice(0, 60).map(item => `
        <article class="mention">
          <div class="mention-title">
            <span>${escapeHtml(item.stock_name)}</span>
            <span>${escapeHtml(item.trade_date || "")}</span>
          </div>
          <div>${sentimentPill(item.sentiment, item.mention_type)}${pills(item.theme, "green")}</div>
          <p>${escapeHtml(item.evidence || "")}</p>
          <a href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">${escapeHtml(item.article_title)}</a>
        </article>
      `).join("");
    }

    function sentimentBadges(item) {
      return `
        <div class="sentiment">
          <span class="sentiment-badge good">利好 ${Number(item.bullish_count || 0)}</span>
          <span class="sentiment-badge bad">利空 ${Number(item.bearish_count || 0)}</span>
          <span class="sentiment-badge neutral">普通 ${Number(item.neutral_count || 0)}</span>
        </div>
      `;
    }

    function sentimentPill(sentiment, label) {
      const klass = sentiment === "bullish" ? "good" : sentiment === "bearish" ? "bad" : "neutral";
      const text = sentiment === "bullish" ? "利好" : sentiment === "bearish" ? "利空" : "普通";
      return `<span class="sentiment-badge ${klass}">${text}: ${escapeHtml(label || "")}</span>`;
    }

    function renderStocks(stocks) {
      const body = document.querySelector("#stocksBody");
      if (!stocks.length) {
        body.innerHTML = `<tr><td colspan="6" class="empty">暂无数据</td></tr>`;
        return;
      }
      body.innerHTML = stocks.map(item => `
        <tr>
          <td>
            <div class="stock-name">${escapeHtml(item.stock_name)}</div>
            <div class="code">${escapeHtml(item.stock_code || "-")}</div>
          </td>
          <td>${escapeHtml(item.market || "未知")}</td>
          <td>${pills(item.themes, "green")}</td>
          <td>${item.mention_count}</td>
          <td>${Number(item.max_confidence || 0).toFixed(2)}</td>
          <td><div class="evidence">${escapeHtml(item.evidence || "")}</div></td>
        </tr>
      `).join("");
    }

    function renderThemes(themes) {
      const box = document.querySelector("#themeBars");
      if (!themes.length) {
        box.innerHTML = `<div class="empty">暂无题材统计</div>`;
        return;
      }
      const max = Math.max(...themes.map(item => item.mention_count), 1);
      box.innerHTML = themes.map(item => {
        const width = Math.max(8, Math.round(item.mention_count / max * 100));
        return `
          <div class="bar-row">
            <div>${escapeHtml(item.theme)}</div>
            <div class="bar-bg"><div class="bar" style="--w:${width}%"></div></div>
            <div>${item.mention_count}</div>
          </div>
        `;
      }).join("");
    }

    function renderMentions(mentions) {
      const box = document.querySelector("#mentionsList");
      if (!mentions.length) {
        box.innerHTML = `<div class="empty">暂无证据明细</div>`;
        return;
      }
      box.innerHTML = mentions.map(item => `
        <article class="mention">
          <div class="mention-title">
            <span>${escapeHtml(item.stock_name)}</span>
            <span>${Number(item.confidence || 0).toFixed(2)}</span>
          </div>
          <div>${pills(item.theme, "green")}${pills(item.mention_type, "amber")}</div>
          <p>${escapeHtml(item.evidence || "")}</p>
          <p>${escapeHtml(item.reason || "")}</p>
          <a href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">${escapeHtml(item.article_title)}</a>
        </article>
      `).join("");
    }

    function pills(value, klass) {
      const values = String(value || "").split(",").map(v => v.trim()).filter(Boolean);
      if (!values.length) return `<span class="pill">未分类</span>`;
      return values.map(v => `<span class="pill ${klass || ""}">${escapeHtml(v)}</span>`).join("");
    }

    function textOf(item) {
      return Object.values(item).join(" ");
    }

    function setText(selector, value) {
      document.querySelector(selector).textContent = value;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    bootstrap().catch(err => {
      statusText.textContent = "连接失败";
      console.error(err);
    });
  </script>
</body>
</html>
